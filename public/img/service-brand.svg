<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Modern boardroom with a team discussing strategy">
  <defs>
    <linearGradient id="sbBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091022"/><stop offset="1" stop-color="#050810"/></linearGradient>
    <radialGradient id="sbGlow" cx="0.5" cy="0.35" r="0.6"><stop offset="0" stop-color="#9fd8ff" stop-opacity="0.32"/><stop offset="1" stop-color="#9fd8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sbTable" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c4f8f"/><stop offset="1" stop-color="#0d142a"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sbBg)"/>
  <ellipse cx="400" cy="240" rx="320" ry="200" fill="url(#sbGlow)"/>
  <!-- Presentation screen -->
  <rect x="250" y="90" width="300" height="170" rx="8" fill="#0d142a" stroke="#223352" stroke-width="2"/>
  <g stroke="#58c4ff" stroke-width="3" fill="none" opacity="0.85"><path d="M280 220 L340 180 L390 200 L450 150 L520 175"/></g>
  <g fill="#316bf3" opacity="0.5"><rect x="280" y="120" width="90" height="10"/><rect x="280" y="140" width="60" height="8"/></g>
  <!-- Boardroom table -->
  <ellipse cx="400" cy="430" rx="240" ry="70" fill="url(#sbTable)" stroke="#223352"/>
  <!-- Seated figures around table -->
  <g fill="#16223f" stroke="#4a5d85">
    <circle cx="240" cy="400" r="26"/><circle cx="330" cy="370" r="26"/><circle cx="470" cy="370" r="26"/><circle cx="560" cy="400" r="26"/>
    <circle cx="300" cy="500" r="26"/><circle cx="500" cy="500" r="26"/>
  </g>
  <g fill="#58c4ff" opacity="0.7"><circle cx="240" cy="400" r="8"/><circle cx="470" cy="370" r="8"/><circle cx="500" cy="500" r="8"/></g>
</svg>
