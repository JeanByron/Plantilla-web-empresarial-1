      <stop offset="0" stop-color="#0a1328"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="p4glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#316bf3" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#316bf3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p4bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#123a5e"/>
      <stop offset="1" stop-color="#58c4ff"/>
