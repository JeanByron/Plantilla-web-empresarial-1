    <circle cx="660" cy="300" r="10"/><circle cx="480" cy="420" r="8"/><circle cx="260" cy="380" r="9"/>
  </g>
  <!-- Bar group bottom -->
  <g>
    <rect x="120" y="470" width="44" height="70" rx="3" fill="url(#p4bars)"/>
    <rect x="180" y="430" width="44" height="110" rx="3" fill="url(#p4bars)"/>
    <rect x="240" y="490" width="44" height="50" rx="3" fill="url(#p4bars)"/>
