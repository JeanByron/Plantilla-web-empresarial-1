<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Abstract architecture identity artwork">
  <defs>
    <linearGradient id="p5bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091022"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="p5glow" cx="0.6" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#9fd8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p5col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c4f8f"/>
      <stop offset="1" stop-color="#0d142a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#p5bg)"/>
  <circle cx="500" cy="140" r="240" fill="url(#p5glow)"/>
  <!-- Brutalist stacked volumes -->
  <g stroke="#223352" stroke-width="2">
    <rect x="140" y="320" width="160" height="220" fill="url(#p5col)"/>
    <rect x="300" y="240" width="160" height="300" fill="#101a33"/>
    <rect x="460" y="180" width="120" height="360" fill="url(#p5col)"/>
    <rect x="580" y="300" width="100" height="240" fill="#101a33"/>
  </g>
  <!-- Light edges -->
  <g stroke="#58c4ff" stroke-width="3" opacity="0.85" fill="none">
    <path d="M300 240 V540 M460 180 V540"/>
    <path d="M300 240 H460 M140 320 H300"/>
  </g>
  <!-- Window grid accents -->
  <g fill="#58c4ff" opacity="0.5">
    <rect x="330" y="280" width="24" height="24"/><rect x="370" y="280" width="24" height="24"/>
    <rect x="330" y="330" width="24" height="24"/><rect x="370" y="330" width="24" height="24"/>
    <rect x="490" y="230" width="24" height="24"/><rect x="528" y="230" width="24" height="24"/>
  </g>
  <line x1="120" y1="540" x2="700" y2="540" stroke="#4a5d85" stroke-width="2"/>
</svg>
