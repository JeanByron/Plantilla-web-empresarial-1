    <rect x="245" y="165" width="120" height="80"/>
    <rect x="380" y="165" width="175" height="36"/>
    <rect x="380" y="210" width="175" height="35"/>
    <rect x="245" y="260" width="310" height="95"/>
  </g>
  <g fill="#316bf3" opacity="0.5"><rect x="255" y="175" width="100" height="10"/><rect x="255" y="195" width="70" height="8"/></g>
</svg>
