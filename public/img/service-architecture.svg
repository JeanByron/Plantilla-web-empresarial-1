<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Workspace with wireframes">
  <defs>
    <linearGradient id="saBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1226"/><stop offset="1" stop-color="#050810"/></linearGradient>
    <radialGradient id="saGlow" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#58c4ff" stop-opacity="0.35"/><stop offset="1" stop-color="#58c4ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#saBg)"/>
  <ellipse cx="400" cy="280" rx="320" ry="220" fill="url(#saGlow)"/>
