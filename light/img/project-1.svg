<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Abstract fintech dashboard artwork">
  <defs>
    <linearGradient id="p1bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1226"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="p1line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#316bf3"/>
      <stop offset="1" stop-color="#58c4ff"/>
    </linearGradient>
    <radialGradient id="p1glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#58c4ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#58c4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="p1blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#p1bg)"/>
  <circle cx="560" cy="180" r="200" fill="url(#p1glow)"/>
  <g opacity="0.18" stroke="#58c4ff" stroke-width="1">
    <path d="M0 150 H800 M0 300 H800 M0 450 H800"/>
    <path d="M160 0 V600 M320 0 V600 M480 0 V600 M640 0 V600"/>
  </g>
  <!-- Rising area chart -->
  <path d="M80 470 L200 420 L300 440 L420 330 L540 360 L680 230 L720 250 V520 H80 Z" fill="url(#p1line)" opacity="0.22"/>
  <path d="M80 470 L200 420 L300 440 L420 330 L540 360 L680 230 L720 250" fill="none" stroke="url(#p1line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#8fd4ff">
    <circle cx="200" cy="420" r="6"/><circle cx="420" cy="330" r="6"/><circle cx="680" cy="230" r="7"/>
  </g>
  <!-- KPI bars -->
  <g opacity="0.9">
    <rect x="100" y="120" width="60" height="90" rx="4" fill="#123a5e"/>
    <rect x="180" y="90" width="60" height="120" rx="4" fill="#1c4f8f"/>
    <rect x="260" y="60" width="60" height="150" rx="4" fill="#58c4ff" opacity="0.8"/>
  </g>
</svg>
