<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Abstract e-commerce experience artwork">
  <defs>
    <linearGradient id="p3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1124"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="p3glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#58c4ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#58c4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p3card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c4f8f"/>
      <stop offset="1" stop-color="#0d142a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#p3bg)"/>
  <circle cx="400" cy="260" r="240" fill="url(#p3glow)"/>
  <!-- Floating product cards in perspective -->
  <g>
    <rect x="150" y="190" width="180" height="240" rx="10" fill="url(#p3card)" stroke="#223352" transform="rotate(-8 240 310)"/>
    <rect x="470" y="190" width="180" height="240" rx="10" fill="url(#p3card)" stroke="#223352" transform="rotate(8 560 310)"/>
    <rect x="310" y="150" width="180" height="280" rx="12" fill="#11335c" stroke="#58c4ff" stroke-opacity="0.6"/>
  </g>
  <g fill="#58c4ff" opacity="0.9">
    <circle cx="400" cy="220" r="34"/>
    <rect x="350" y="300" width="100" height="10" rx="5" fill="#8fd4ff"/>
    <rect x="365" y="324" width="70" height="8" rx="4" fill="#4a5d85"/>
  </g>
  <!-- Add to cart pulse -->
  <circle cx="400" cy="390" r="22" fill="#58c4ff"/>
  <path d="M390 390 h20 M400 380 v20" stroke="#02101f" stroke-width="3" stroke-linecap="round"/>
</svg>
