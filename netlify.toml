# Netlify configuration — static deployment of AuraDesign Studio.
# The CSS is already compiled in public/css/tailwind.css, so no build step is
# needed: we just publish the static `public/` folder. (This also means
# connecting your Git repo works without Node — Netlify won't try to build.)

[build]
  publish = "public"

# Long-cache the original SVG artwork and the compiled CSS (content-hashed by
# deploy, safe to cache aggressively).
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/css/tailwind.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Serve the styled 404 page for unknown routes.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
