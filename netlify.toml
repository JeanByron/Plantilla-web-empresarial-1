# Netlify configuration — static deployment of AuraDesign Studio.
# Builds the Tailwind CSS, then publishes the static `public/` folder.

[build]
  command = "npm install && npm run build:css"
  publish = "public"

# Long-cache the original SVG artwork and the compiled CSS (content-hashed by
# deploy, safe to cache aggressively).
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/css/tailwind.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Serve the styled 404 page for unknown routes.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
