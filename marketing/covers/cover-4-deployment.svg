<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1326"/><stop offset="1" stop-color="#050810"/></linearGradient>
    <radialGradient id="glow4" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#316bf3" stop-opacity="0.3"/><stop offset="1" stop-color="#316bf3" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg4)"/>
  <ellipse cx="640" cy="360" rx="640" ry="360" fill="url(#glow4)"/>
  <text x="640" y="110" text-anchor="middle" fill="#9fb2d1" font-size="22" letter-spacing="6" font-weight="600">ONE TEMPLATE, TWO WAYS TO SHIP</text>
  <text x="640" y="174" text-anchor="middle" fill="#eaf2ff" font-size="56" font-weight="800" letter-spacing="-1">Static or full-stack. No rewrite.</text>

  <!-- Static card -->
  <g transform="translate(120,250)">
    <rect width="440" height="360" rx="18" fill="#0d142a" stroke="#1c2a4a" stroke-width="2"/>
    <text x="40" y="70" fill="#58c4ff" font-size="30" font-weight="800">Static</text>
    <text x="40" y="106" fill="#9fb2d1" font-size="20">No server required</text>
    <g font-size="21" fill="#dbe6f7">
      <g transform="translate(40,160)"><circle cx="8" cy="-7" r="5" fill="#58c4ff"/><text x="28">Drag the public/ folder to Netlify</text></g>
      <g transform="translate(40,202)"><circle cx="8" cy="-7" r="5" fill="#58c4ff"/><text x="28">Portfolio from a JSON data file</text></g>
      <g transform="translate(40,244)"><circle cx="8" cy="-7" r="5" fill="#58c4ff"/><text x="28">Form via Formspree (1 line)</text></g>
      <g transform="translate(40,286)"><circle cx="8" cy="-7" r="5" fill="#58c4ff"/><text x="28">Free hosting, instant deploy</text></g>
    </g>
  </g>

  <!-- vs -->
  <circle cx="640" cy="430" r="34" fill="#11335c" stroke="#58c4ff"/>
  <text x="640" y="440" text-anchor="middle" fill="#9fd8ff" font-size="22" font-weight="700">OR</text>

  <!-- Full-stack card -->
  <g transform="translate(720,250)">
    <rect width="440" height="360" rx="18" fill="#0d142a" stroke="#1c2a4a" stroke-width="2"/>
    <text x="40" y="70" fill="#9fd8ff" font-size="30" font-weight="800">Full-stack</text>
    <text x="40" y="106" fill="#9fb2d1" font-size="20">Node + Express included</text>
    <g font-size="21" fill="#dbe6f7">
      <g transform="translate(40,160)"><circle cx="8" cy="-7" r="5" fill="#58c4ff"/><text x="28">Real contact-form API</text></g>
      <g transform="translate(40,202)"><circle cx="8" cy="-7" r="5" fill="#58c4ff"/><text x="28">Live inquiries dashboard</text></g>
      <g transform="translate(40,244)"><circle cx="8" cy="-7" r="5" fill="#58c4ff"/><text x="28">Honeypot + rate limit + admin key</text></g>
      <g transform="translate(40,286)"><circle cx="8" cy="-7" r="5" fill="#58c4ff"/><text x="28">Deploy to Render, Railway, a VPS</text></g>
    </g>
  </g>
</svg>
