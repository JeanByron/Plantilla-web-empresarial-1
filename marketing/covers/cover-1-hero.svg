<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1326"/><stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#58c4ff" stop-opacity="0.4"/><stop offset="1" stop-color="#58c4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58c4ff"/><stop offset="1" stop-color="#9fd8ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11335c"/><stop offset="1" stop-color="#0b1530"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1000" cy="200" r="420" fill="url(#glow)"/>
  <!-- dot mesh hint -->
  <g fill="#58c4ff" opacity="0.13">
    <!-- generated grid -->
    <g>
      <circle cx="80" cy="80" r="2"/><circle cx="140" cy="80" r="2"/><circle cx="200" cy="80" r="2"/><circle cx="260" cy="80" r="2"/>
      <circle cx="80" cy="140" r="2"/><circle cx="140" cy="140" r="2"/><circle cx="200" cy="140" r="2"/><circle cx="260" cy="140" r="2"/>
      <circle cx="80" cy="200" r="2"/><circle cx="140" cy="200" r="2"/><circle cx="200" cy="200" r="2"/><circle cx="260" cy="200" r="2"/>
    </g>
  </g>

  <!-- Left: copy -->
  <text x="90" y="150" fill="#9fb2d1" font-size="22" letter-spacing="6" font-weight="600">WEB DESIGN AGENCY TEMPLATE</text>
  <text x="86" y="270" fill="#eaf2ff" font-size="92" font-weight="800" letter-spacing="-2">AuraDesign</text>
  <text x="90" y="360" fill="url(#accent)" font-size="86" font-weight="800" letter-spacing="-2">Studio</text>
  <text x="90" y="430" fill="#9fb2d1" font-size="28" font-weight="400">Dark, futuristic, and interactive —</text>
  <text x="90" y="468" fill="#9fb2d1" font-size="28" font-weight="400">built to win premium clients.</text>

  <!-- bullets -->
  <g font-size="22" fill="#dbe6f7" font-weight="500">
    <g transform="translate(90,540)"><circle cx="10" cy="-7" r="5" fill="#58c4ff"/><text x="30" y="0">Interactive canvas effects</text></g>
    <g transform="translate(90,584)"><circle cx="10" cy="-7" r="5" fill="#58c4ff"/><text x="30" y="0">Analytics dashboard</text></g>
    <g transform="translate(90,628)"><circle cx="10" cy="-7" r="5" fill="#58c4ff"/><text x="30" y="0">Static or full-stack deployment</text></g>
    <g transform="translate(430,540)"><circle cx="10" cy="-7" r="5" fill="#58c4ff"/><text x="30" y="0">Working contact form</text></g>
    <g transform="translate(430,584)"><circle cx="10" cy="-7" r="5" fill="#58c4ff"/><text x="30" y="0">9 pages, SEO ready</text></g>
    <g transform="translate(430,628)"><circle cx="10" cy="-7" r="5" fill="#58c4ff"/><text x="30" y="0">Tailwind CSS + Express</text></g>
  </g>

  <!-- Right: browser mockup -->
  <g transform="translate(720,150)">
    <rect x="0" y="0" width="470" height="300" rx="14" fill="url(#card)" stroke="#1c2a4a" stroke-width="2"/>
    <rect x="0" y="0" width="470" height="40" rx="14" fill="#0c1226"/>
    <circle cx="24" cy="20" r="5" fill="#ff5449"/><circle cx="44" cy="20" r="5" fill="#9fd8ff"/><circle cx="64" cy="20" r="5" fill="#58c4ff"/>
    <!-- hero inside mockup -->
    <text x="40" y="120" fill="#eaf2ff" font-size="34" font-weight="800">We turn visions into</text>
    <text x="40" y="160" fill="#58c4ff" font-size="34" font-weight="800">digital reality</text>
    <rect x="40" y="190" width="150" height="40" rx="6" fill="#58c4ff"/>
    <rect x="205" y="190" width="150" height="40" rx="6" fill="none" stroke="#4a5d85"/>
    <!-- rising chart corner -->
    <path d="M40 280 L110 250 L170 262 L240 222 L320 240 L420 200" fill="none" stroke="#58c4ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- badge -->
  <g transform="translate(720,500)">
    <rect x="0" y="0" width="470" height="170" rx="14" fill="#0d142a" stroke="#1c2a4a"/>
    <text x="28" y="50" fill="#9fb2d1" font-size="18" letter-spacing="2">WHAT YOU GET</text>
    <text x="28" y="92" fill="#eaf2ff" font-size="26" font-weight="700">HTML + Tailwind + Node</text>
    <text x="28" y="128" fill="#9fb2d1" font-size="20">Full source · docs · commercial license</text>
  </g>
</svg>
